[project]
name = "hospital-price-audit"
version = "0.1.0"
description = "Audit of hospital price files under the 2026 CMS allowed-amount rule"
requires-python = ">=3.11"
dependencies = [
    "ijson>=3.6.0",
    "pytest>=9.1.1",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]
